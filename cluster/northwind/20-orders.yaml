# The orders service and its database.
#
# Deliberate weaknesses:
#   SC-03  end-of-life base image with known critical vulnerabilities
#   SC-04  database credentials in a ConfigMap, in plain text
#   SC-09  no resource limits
#   SC-05  runs as root
---
# SC-04: credentials in a ConfigMap. Not even base64, let alone a secret store.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
  namespace: northwind-orders
  annotations:
    stathe.io/findings: "SC-04"
data:
  DB_HOST: postgres.northwind-orders.svc.cluster.local
  DB_USER: northwind
  DB_PASSWORD: hunter2-demo-only
  DB_NAME: orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: northwind-orders
  labels:
    app: orders
  annotations:
    stathe.io/findings: "SC-03,SC-04,SC-05,SC-09"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          # SC-03: Node 16 went end of life in 2023. No fixes are coming.
          image: node:16-alpine
          command: ["node", "-e"]
          args:
            - |
              const http = require('http');
              http.createServer((req, res) => {
                res.writeHead(200, {'Content-Type': 'application/json'});
                res.end(JSON.stringify({service: 'orders', node: process.version}));
              }).listen(3000, () => console.log('orders listening on 3000'));
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: orders-config
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: northwind-orders
spec:
  selector:
    app: orders
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: northwind-orders
  labels:
    app: postgres
  annotations:
    stathe.io/findings: "SC-03,SC-09"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:13-alpine
          env:
            - name: POSTGRES_USER
              value: northwind
            - name: POSTGRES_PASSWORD
              value: hunter2-demo-only
            - name: POSTGRES_DB
              value: orders
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: northwind-orders
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

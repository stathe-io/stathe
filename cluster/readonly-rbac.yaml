# The least access stathe can do its work with.
#
# Hand this to whoever owns the cluster before the assessment starts. It is the
# whole permission set: ten resource types, one verb. There is no `get` here
# and no `watch`, because the code does not call them -- it lists each type
# once and works on what comes back.
#
# Two claims in this file are worth verifying rather than believing:
#
#   kubectl auth can-i --list --as=system:serviceaccount:stathe:stathe
#
# prints what this grants. It also lists a dozen read-only endpoints like
# /version and /apis -- those come from system:discovery and system:public-info-viewer,
# which Kubernetes gives every authenticated identity, and are not granted here.
# The `list` rules at the bottom are the whole of what this file adds. And:
#
#   kubectl auth can-i create pods --as=system:serviceaccount:stathe:stathe
#   kubectl auth can-i get secrets --as=system:serviceaccount:stathe:stathe
#   kubectl auth can-i delete deployments --as=system:serviceaccount:stathe:stathe
#
# all print "no". Secrets are absent on purpose: stathe has no permission to
# read them. ConfigMaps are different: the API cannot list key names alone, so
# the response carries the values too. stathe keeps the key names and discards
# the values as each object is parsed; they are never stored or written out.
#
# Apply:   kubectl apply -f cluster/readonly-rbac.yaml
# Remove:  kubectl delete -f cluster/readonly-rbac.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: stathe
  labels:
    app.kubernetes.io/name: stathe
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stathe
  namespace: stathe
  labels:
    app.kubernetes.io/name: stathe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stathe-readonly
  labels:
    app.kubernetes.io/name: stathe
rules:
  # Workloads: read the pod template to find privileged containers, host
  # mounts, missing resource limits and mutable image tags.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]

  # Jobs and CronJobs: the same pod template, on workloads that exist only
  # while they run. A nightly job with the node mounted is the one nobody is
  # watching.
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list"]

  # Pods: only the ones no controller created. A pod started per CI build is
  # often the most privileged workload on the cluster and belongs to no
  # Deployment, so without this it is invisible. Pods owned by a workload above
  # are dropped on parse: they are that controller's template over again.
  #
  # This reads pod specs, never logs and never `exec` -- neither verb is
  # granted anywhere in this file.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]

  # ConfigMaps: only the key names are kept, to spot credentials kept outside a
  # Secret. Values arrive in the list response and are discarded on parse.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["list"]

  # NetworkPolicies: to establish which namespaces have no separation at all.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["list"]

  # ClusterRoleBindings: to find workloads bound to cluster-admin.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["list"]

  # ValidatingAdmissionPolicies: to notice that the cluster may already enforce
  # image digests, which is a note in the output and never a reason to drop a
  # finding -- stathe does not interpret policy expressions. A cluster without
  # this API is fine; stathe says it could not read the type and carries on, so
  # this rule can be left out if your policy forbids it.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stathe-readonly
  labels:
    app.kubernetes.io/name: stathe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stathe-readonly
subjects:
  - kind: ServiceAccount
    name: stathe
    namespace: stathe

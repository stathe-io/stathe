name: release

# A release is a tag. The image and the binaries are built from that tag by this
# workflow and by nothing else, signed without a long-lived key, and described
# by provenance anyone can verify. See SECURITY.md for the commands.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create the GitHub release
      packages: write        # push to ghcr.io
      id-token: write        # keyless signing (OIDC)
      attestations: write    # build provenance
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest patch of the language version, not the floor in go.mod.
          # `go-version-file: go.mod` installs that floor exactly, and a Go
          # 1.26.0 standard library has 34 vulnerabilities govulncheck reports
          # and this build would otherwise ship. setup-go sets GOTOOLCHAIN=local,
          # so go.mod's own toolchain directive cannot correct it here.
          #
          # Raise this together with the `go` line in go.mod and the Dockerfile
          # base image; `make vuln` is the check that catches it when they drift.
          go-version: "1.26.x"
          check-latest: true

      - name: Test before anything is published
        run: |
          go mod verify
          go vet ./...
          go test -race -count=1 ./...

      # The same gate CI applies, because CI does not gate a tag push and this
      # is the only thing standing between a known-vulnerable build and a
      # signed release. v0.3.1-rc.1 was published with a Go 1.26.0 standard
      # library carrying 34 known vulnerabilities -- tested, signed, with an
      # SBOM and provenance describing exactly that. A release that cannot say
      # it ran this check is a release whose attestations describe something
      # nobody should run.
      - name: No known vulnerabilities in what is about to be published
        run: make vuln VULN_TOOLCHAIN=local

      - name: Build static binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            out="stathe_${VERSION}_${os}_${arch}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${out}${ext}" ./cmd/stathe
          done
          cd dist && sha256sum * > SHA256SUMS

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.bundle dist/SHA256SUMS

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest` tag on purpose: stathe's own SC-07 flags floating tags.
      - name: Build and push the image, with SBOM and provenance
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Sign the image by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${VERSION}" dist/* --generate-notes --verify-tag

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. A job that needs more asks for it by name.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest patch of the language version, not the floor in go.mod.
          # `go-version-file: go.mod` installs that floor exactly, and a Go
          # 1.26.0 standard library has 34 vulnerabilities govulncheck reports
          # and this build would otherwise ship. setup-go sets GOTOOLCHAIN=local,
          # so go.mod's own toolchain directive cannot correct it here.
          #
          # Raise this together with the `go` line in go.mod and the Dockerfile
          # base image; `make vuln` is the check that catches it when they drift.
          go-version: "1.26.x"
          check-latest: true

      - name: Everything this build trusts is pinned
        run: |
          # A tag can be moved underneath a build; a commit SHA and a digest
          # cannot. stathe's own SC-07 says this about every image it finds, so
          # the pipeline has to hold itself to it -- and a dependency bump has
          # already replaced two SHA pins with plain tags once, which is
          # exactly the drift a comment in the file cannot catch.
          unpinned=$(grep -rnE '^[[:space:]]*(- )?uses:' .github/workflows/ \
            | grep -vE '@[0-9a-f]{40}' || true)
          if [ -n "$unpinned" ]; then
            echo "These actions are not pinned to a commit SHA:"
            echo "$unpinned"
            echo "Fix with: go run github.com/suzuki-shunsuke/pinact/cmd/pinact@latest run"
            exit 1
          fi

          unpinned=$(grep -nE '^FROM ' Dockerfile | grep -v '@sha256:' || true)
          if [ -n "$unpinned" ]; then
            echo "These base images are not pinned to a digest:"
            echo "$unpinned"
            echo "Fix with: docker buildx imagetools inspect <image>:<tag> | grep '^Digest:'"
            exit 1
          fi

      - name: Modules match go.sum
        run: go mod verify

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Tests (with the race detector)
        run: go test -race -count=1 ./...

      # VULN_TOOLCHAIN=local: scan with the toolchain this job installed, which
      # is the one that built everything above. The Makefile pins a version for
      # a laptop, where "whatever is installed" is how a clean local scan and a
      # failing CI scan disagreed in the first place.
      - name: Dependencies and standard library with known vulnerabilities
        run: make vuln VULN_TOOLCHAIN=local

      - name: Fuzz the manifest parser briefly
        run: go test ./internal/scan -run '^$' -fuzz FuzzLoadDir -fuzztime 30s

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Dockerfile runs the binary against the demo manifests as a build
      # step, so a successful build already proves the image works.
      - name: Build the image (not pushed)
        run: docker build --build-arg VERSION=ci -t stathe:ci .

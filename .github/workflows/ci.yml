name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. A job that needs more asks for it by name.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # TODO(hardening): pin every `uses:` below to a full commit SHA
      # (`pinact run` does it in one go). Tags can be moved; SHAs cannot.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Modules match go.sum
        run: go mod verify

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Tests (with the race detector)
        run: go test -race -count=1 ./...

      - name: Dependencies with known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Fuzz the manifest parser briefly
        run: go test ./internal/scan -run '^$' -fuzz FuzzLoadDir -fuzztime 30s

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The Dockerfile runs the binary against the demo manifests as a build
      # step, so a successful build already proves the image works.
      - name: Build the image (not pushed)
        run: docker build --build-arg VERSION=ci -t stathe:ci .

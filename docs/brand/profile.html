<!doctype html>
<meta charset="utf-8">
<style>
  :root { --ink:#0a1420; --glow:#0b2a32; --word:#e8eef4; --accent:#19c7b2; --muted:#8ba3ad; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1584px; height:396px; }
  body {
    background:
      radial-gradient(120% 170% at 70% -30%, var(--glow) 0%, rgba(11,42,50,0) 60%),
      var(--ink);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    display:flex; align-items:center; justify-content:space-between;
    /* A profile photo sits over the lower left, so the wordmark starts clear
       of it and nothing important goes below the midline there. */
    padding: 0 110px 0 460px;
    overflow:hidden;
  }
  .wrap { display:flex; flex-direction:column; gap:20px; }
  .mark { font-size:104px; font-weight:900; letter-spacing:-4px; color:var(--word);
          line-height:1; display:flex; align-items:flex-end; gap:12px; }
  .dot { width:25px; height:25px; background:var(--accent); margin-bottom:8px; }
  .line { font-size:25px; font-weight:500; color:var(--muted); }
  .line b { color:var(--word); font-weight:600; }
  .cols { display:flex; gap:40px; padding-top:6px; }
  .col { display:flex; flex-direction:column; gap:7px; }
  .k { font-size:12px; font-weight:700; letter-spacing:1.6px; color:var(--accent); }
  .v { font-size:14px; color:var(--muted); }
</style>
<div class="wrap">
  <div class="mark">stathe<span class="dot"></span></div>
  <div class="line">Read-only Kubernetes assessment. <b>Nothing installed, nothing hidden.</b></div>
  <div class="cols">
    <div class="col"><div class="k">FINDINGS</div><div class="v">what is wrong, with the next step</div></div>
    <div class="col"><div class="k">NOT ASSESSED</div><div class="v">what was filtered out, and why</div></div>
    <div class="col"><div class="k">ACCEPTED</div><div class="v">with a reason and an expiry date</div></div>
  </div>
</div>
